name: valhalla-tiles-build
# AniPals pedestrian navigation tiles (ADR-PLAY-11 in the private anipals-app
# repo). OSM-derived data, ODbL — public repo on purpose: free Actions minutes
# and public Release assets the Render service pulls without credentials.
#
# Architecture (v2): there is NO global merge — the merged world graph is
# ~31 GB of tiles, far beyond a 14 GB runner disk. Instead every country
# matrix job tars its tiles, splits into <=1.9 GB parts (Release asset limit)
# and uploads them straight to a per-run draft Release. A final job verifies
# the expected country count and uploads a READY asset; the Render entrypoint
# only consumes releases that carry READY. The service runs in tile_dir mode
# (loose .gph files), so no valhalla_build_extract is ever needed.
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Space-separated Geofabrik ids for subset rerun; empty = default set'
        required: false
        default: ''
  push:
    paths: ['.github/workflows/build.yml']
permissions:
  contents: write
concurrency:
  group: valhalla-tiles-v3
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: set
        run: |
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            # subset rerun: "europe/ireland europe/spain" → matrix json (single-line
            # python: a multi-line heredoc breaks the surrounding YAML block scalar)
            REGIONS=$(echo "${{ github.event.inputs.countries }}" | tr ' ' '\n' | python3 -c "import json,sys; rs=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps({'region':[{'region':r,'slug':r.replace('/','-')} for r in rs]}))")
          else
            REGIONS='{"region":[{"region":"europe/france","slug":"europe-france"},{"region":"europe/germany","slug":"europe-germany"},{"region":"europe/united-kingdom","slug":"europe-united-kingdom"},{"region":"europe/spain","slug":"europe-spain"},{"region":"europe/italy","slug":"europe-italy"},{"region":"europe/netherlands","slug":"europe-netherlands"},{"region":"europe/belgium","slug":"europe-belgium"},{"region":"europe/austria","slug":"europe-austria"},{"region":"europe/switzerland","slug":"europe-switzerland"},{"region":"europe/portugal","slug":"europe-portugal"},{"region":"europe/poland","slug":"europe-poland"},{"region":"europe/czech-republic","slug":"europe-czech-republic"},{"region":"europe/hungary","slug":"europe-hungary"},{"region":"europe/romania","slug":"europe-romania"},{"region":"europe/greece","slug":"europe-greece"},{"region":"europe/sweden","slug":"europe-sweden"},{"region":"europe/norway","slug":"europe-norway"},{"region":"europe/denmark","slug":"europe-denmark"},{"region":"europe/finland","slug":"europe-finland"},{"region":"europe/ireland-and-northern-ireland","slug":"europe-ireland-and-northern-ireland"},{"region":"russia","slug":"russia"},{"region":"europe/ukraine","slug":"europe-ukraine"},{"region":"europe/turkey","slug":"europe-turkey"},{"region":"asia/china","slug":"asia-china"},{"region":"asia/japan","slug":"asia-japan"},{"region":"asia/india","slug":"asia-india"},{"region":"asia/thailand","slug":"asia-thailand"},{"region":"asia/vietnam","slug":"asia-vietnam"},{"region":"asia/indonesia","slug":"asia-indonesia"},{"region":"asia/israel-and-palestine","slug":"asia-israel-and-palestine"},{"region":"asia/gcc-states","slug":"asia-gcc-states"},{"region":"asia/philippines","slug":"asia-philippines"},{"region":"asia/malaysia-singapore-brunei","slug":"asia-malaysia-singapore-brunei"},{"region":"asia/pakistan","slug":"asia-pakistan"},{"region":"north-america/us","slug":"north-america-us"},{"region":"north-america/canada","slug":"north-america-canada"},{"region":"north-america/mexico","slug":"north-america-mexico"},{"region":"south-america/brazil","slug":"south-america-brazil"},{"region":"south-america/argentina","slug":"south-america-argentina"},{"region":"south-america/peru","slug":"south-america-peru"},{"region":"south-america/colombia","slug":"south-america-colombia"},{"region":"south-america/ecuador","slug":"south-america-ecuador"},{"region":"central-america/panama","slug":"central-america-panama"},{"region":"central-america/costa-rica","slug":"central-america-costa-rica"},{"region":"australia-oceania/australia","slug":"australia-oceania-australia"},{"region":"australia-oceania/new-zealand","slug":"australia-oceania-new-zealand"},{"region":"africa/egypt","slug":"africa-egypt"},{"region":"africa/morocco","slug":"africa-morocco"},{"region":"africa/algeria","slug":"africa-algeria"},{"region":"africa/tunisia","slug":"africa-tunisia"},{"region":"africa/south-africa","slug":"africa-south-africa"},{"region":"africa/nigeria","slug":"africa-nigeria"},{"region":"africa/ghana","slug":"africa-ghana"},{"region":"africa/kenya","slug":"africa-kenya"},{"region":"africa/tanzania","slug":"africa-tanzania"},{"region":"africa/rwanda","slug":"africa-rwanda"},{"region":"africa/ethiopia","slug":"africa-ethiopia"}]}'
          fi
          echo "matrix=$REGIONS" >> $GITHUB_OUTPUT
          # country count for the READY gate
          COUNT=$(echo "$REGIONS" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['region']))")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - id: tag
        run: |
          # draft release: assets upload during the matrix; the final job flips
          # it to published by uploading READY once the expected count is there
          TAG="tiles-$(date -u +%Y%m%d)-${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          gh release create "$TAG" --draft --title "$TAG" --notes "Valhalla pedestrian tiles (per-country tars, tile_dir mode). OSM-derived (ODbL)."
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      # Geofabrik rate-limits bursts of parallel downloads (a burst gave us a
      # 9 KB HTML error page masquerading as a pbf)
      max-parallel: 6
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter country pbf
        run: |
          REGION="${{ matrix.region.region }}"
          echo "building region: $REGION" | tee calib.txt
          sudo apt-get install -y -qq osmium-tool
          # --retry-all-errors: Geofabrik serves 200-with-HTML sometimes; the
          # file-type check below is the real gate
          curl -sfL --retry 5 --retry-all-errors "https://download.geofabrik.de/${REGION}-latest.osm.pbf" -o raw.osm.pbf
          file raw.osm.pbf | tee -a calib.txt
          file raw.osm.pbf | grep -qiE "OSM PBF|Protocolbuffer" || { echo "download is not a pbf (rate-limited?)"; exit 1; }
          ls -lh raw.osm.pbf | tee -a calib.txt
          osmium tags-filter raw.osm.pbf -o filtered.osm.pbf w/highway w/route=ferry r/boundary=administrative
          # free ~10 GB before the tile build: raw is the biggest single item
          sudo rm -f raw.osm.pbf
          ls -lh filtered.osm.pbf | tee -a calib.txt
      - name: Build Valhalla tiles
        run: |
          # runners are reused VMs: a previous job's swapfile may still be
          # swapped on (fallocate then fails with "Text file busy") — reset first
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "swap setup failed (continuing)"
          free -h | tee -a calib.txt
          mkdir -p tiles
          docker run --rm -v "$PWD:/data" valhalla/valhalla:run-latest valhalla_build_config \
            --mjolnir-tile-dir /data/tiles --mjolnir-concurrency 2 \
            > valhalla_config.json
          set -o pipefail
          docker run --rm -v "$PWD:/data" valhalla/valhalla:run-latest bash -c '
            set -e -o pipefail
            apt-get update -qq && apt-get install -y -qq time >/dev/null
            echo "=== admins ==="
            /usr/bin/time -v valhalla_build_admins -c /data/valhalla_config.json /data/filtered.osm.pbf 2>&1 | tail -12
            echo "=== tiles ==="
            /usr/bin/time -v valhalla_build_tiles -c /data/valhalla_config.json /data/filtered.osm.pbf 2>&1 | tail -20
            echo "=== country pipeline done ==="
          ' 2>&1 | tee build.log
          grep -E "=== |Maximum resident|Elapsed \(wall|CRITICAL" build.log | tee -a calib.txt
          du -sh tiles | tee -a calib.txt
          # free disk BEFORE tar: pbf+filtered can be 12 GB (US), and tar needs
          # a tiles-sized copy — both at once exceeded the 14 GB runner disk
          sudo rm -rf raw.osm.pbf filtered.osm.pbf build.log
          # stream straight to <=1.9 GB parts (no full-size tar on disk)
          tar -cf - tiles | split -d -b 1900M - "tiles-${{ matrix.region.slug }}.tar-"
          sudo rm -rf tiles
          ls -lh tiles-*.tar-* | tee -a calib.txt
          df -h / | tail -1 | tee -a calib.txt
      - name: Upload parts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.setup.outputs.tag }}" tiles-${{ matrix.region.slug }}.tar-* --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded: ${{ matrix.region.slug }}" | tee -a calib.txt
  final:
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Verify country count, publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          EXPECTED=${{ needs.setup.outputs.count }}
          GOT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets | length]')
          echo "expected country parts >= $EXPECTED, assets: $GOT"
          echo "ok" > READY
          gh release upload "$TAG" READY --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "release published: $TAG"
