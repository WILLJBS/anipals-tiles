name: valhalla-tiles-build
# AniPals pedestrian navigation tiles (ADR-PLAY-11 in the private anipals-app
# repo). OSM-derived data, ODbL — public repo on purpose: free Actions minutes
# and public Release assets the Render service pulls without credentials.
#
# Regional graphs are immutable independent roots. Never overlay their GraphIds.
# Full builds are expensive and run ONLY on explicit dispatch. Subset diagnostics
# remain drafts; a full validated roster publishes schema2 isolated-region READY.
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Space-separated Geofabrik ids for subset rerun; empty = default set'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: valhalla-tiles-v3
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
      production: ${{ steps.set.outputs.production }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact official coverage
        run: python3 tools/coverage.py
      - id: set
        env:
          WANT: ${{ github.event.inputs.countries }}
        run: python3 tools/regions.py "$WANT"
      - id: tag
        run: |
          # draft release: assets upload during the matrix; the final job flips
          # it to published by uploading READY once the expected count is there
          PREFIX=tiles
          if [ "${{ steps.set.outputs.production }}" != "true" ]; then PREFIX=tiles-diagnostic; fi
          TAG="$PREFIX-$(date -u +%Y%m%d)-${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          gh release create "$TAG" --draft --title "$TAG" --notes "Valhalla pedestrian tiles (per-country tars, tile_dir mode). OSM-derived (ODbL)."
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      # Geofabrik rate-limits bursts of parallel downloads (a burst gave us a
      # 9 KB HTML error page masquerading as a pbf)
      max-parallel: 6
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and filter country pbf
        run: |
          REGION="${{ matrix.region.region }}"
          echo "building region: $REGION" | tee calib.txt
          sudo apt-get install -y -qq osmium-tool
          # --retry-all-errors: Geofabrik serves 200-with-HTML sometimes; the
          # file-type check below is the real gate
          curl -sfL --retry 5 --retry-all-errors "https://download.geofabrik.de/${REGION}-latest.osm.pbf" -o raw.osm.pbf
          file raw.osm.pbf | tee -a calib.txt
          file raw.osm.pbf | grep -qiE "OSM PBF|Protocolbuffer" || { echo "download is not a pbf (rate-limited?)"; exit 1; }
          ls -lh raw.osm.pbf | tee -a calib.txt
          osmium tags-filter raw.osm.pbf -o filtered.osm.pbf w/highway w/route=ferry r/boundary=administrative
          # free ~10 GB before the tile build: raw is the biggest single item
          sudo rm -f raw.osm.pbf
          ls -lh filtered.osm.pbf | tee -a calib.txt
      - name: Build Valhalla tiles
        run: |
          # runners are reused VMs: a previous job's swapfile may still be
          # swapped on (fallocate then fails with "Text file busy") — reset first
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "swap setup failed (continuing)"
          free -h | tee -a calib.txt
          VALHALLA_IMAGE=$(cat deploy/valhalla-image.txt)
          mkdir -p tiles
          # Reduced concurrency bounds memory pressure; it is not evidence of
          # corruption's cause. The independent index/digest gates remain mandatory.
          docker run --rm -v "$PWD:/data" "$VALHALLA_IMAGE" valhalla_build_config \
            --mjolnir-tile-dir /data/tiles --mjolnir-concurrency 1 \
            > valhalla_config.json
          set -o pipefail
          docker run --rm -v "$PWD:/data" "$VALHALLA_IMAGE" bash -c '
            set -e -o pipefail
            apt-get update -qq && apt-get install -y -qq time >/dev/null
            echo "=== admins ==="
            /usr/bin/time -v valhalla_build_admins -c /data/valhalla_config.json /data/filtered.osm.pbf 2>&1 | tail -12
            echo "=== tiles ==="
            /usr/bin/time -v valhalla_build_tiles -c /data/valhalla_config.json /data/filtered.osm.pbf 2>&1 | tail -20
            echo "=== country pipeline done ==="
          ' 2>&1 | tee build.log
          grep -E "=== |Maximum resident|Elapsed \(wall|CRITICAL" build.log | tee -a calib.txt
          du -sh tiles | tee -a calib.txt
          # Export is a semantic smoke only: it skips unnamed/shortcut/transit
          # edges and does not validate every node span or spatial bin reference.
          # The strict road-tile ABI/index check below covers every .gph independently.
          python3 tools/validate_tiles.py tiles > tile-validation.json
          jq 'del(.tile_hashes)' tile-validation.json | tee -a calib.txt
          # free disk BEFORE tar: pbf+filtered can be 12 GB (US), and tar needs
          # a tiles-sized copy — both at once exceeded the 14 GB runner disk
          sudo rm -rf raw.osm.pbf filtered.osm.pbf build.log
          # stream straight to <=1.9 GB parts (no full-size tar on disk)
          tar -cf - tiles | split -d -b 1900M - "tiles-${{ matrix.region.slug }}.tar-"
          python3 tools/release_manifest.py region "${{ matrix.region.slug }}" tile-validation.json tiles-${{ matrix.region.slug }}.tar-* > manifest-${{ matrix.region.slug }}.json
          sudo rm -rf tiles
          ls -lh tiles-*.tar-* | tee -a calib.txt
          df -h / | tail -1 | tee -a calib.txt
      - name: Upload parts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.setup.outputs.tag }}" tiles-${{ matrix.region.slug }}.tar-* manifest-${{ matrix.region.slug }}.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded: ${{ matrix.region.slug }}" | tee -a calib.txt
  final:
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.production == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release (READY gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every build job uploads only after its own success, so reaching
          # `final` means all country parts are already on the draft release.
          # gh release upload/edit resolve drafts correctly (the plain
          # releases/tags API endpoint does not return drafts at all).
          TAG="${{ needs.setup.outputs.tag }}"
          gh release download "$TAG" --pattern 'manifest-*.json' --dir manifests --repo "$GITHUB_REPOSITORY"
          # Validate exact roster, provenance, per-region inventory and part hashes before READY.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "'"$TAG"'") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-assets.json
          python3 tools/release_manifest.py ready release-assets.json manifests/*.json > READY
          gh release upload "$TAG" READY deploy/coverage.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "release published: $TAG"
