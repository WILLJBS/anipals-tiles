name: collect-private-places-full
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare full contract or execute exact prepared spec
        type: choice
        options: [prepare, execute]
        required: true
      source_sha:
        description: Exact reviewed runner commit; dispatch matching ref
        required: true
      bucket:
        description: Authorized private R2 bucket
        required: true
      input_key:
        description: Exact private content-addressed collector spec key
        required: true
      input_sha:
        description: Reviewed collector spec SHA256
        required: true
      input_bytes:
        description: Exact collector spec byte length
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: private-place-collector
  cancel-in-progress: false
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Match reviewed dispatch and checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed runtime dependencies
        run: python -m pip install --disable-pip-version-check -r tools/storage-requirements.txt duckdb==1.4.5
      - name: Offline checkpoint and budget guards
        run: python -m unittest discover -s tests -p 'test_cloud*.py'
      - name: Validate actual pilot and run private global collector
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ inputs.bucket }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_KEY: ${{ inputs.input_key }}
          INPUT_SHA: ${{ inputs.input_sha }}
          INPUT_BYTES: ${{ inputs.input_bytes }}
        run: |
          python tools/cloud_collect_full.py "$OPERATION" --source-sha "$SOURCE_SHA" \
            --input-key "$INPUT_KEY" --input-sha "$INPUT_SHA" --input-bytes "$INPUT_BYTES"
# Private source/code/checkpoints/results never become Actions artifacts.
