name: valhalla-deploy-image
# Publishes the Render runtime image (deploy/) to GHCR. The image ships the
# entrypoint that pulls the tile Release onto the persistent disk and serves
# it with valhalla_service. Public repo → public ghcr image → Render pulls
# without credentials. Runs when the deploy image sources change or manually.
on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-image.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: valhalla-deploy-image
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: base
        run: echo "image=$(cat deploy/valhalla-image.txt)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: VALHALLA_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ghcr.io/willjbs/anipals-valhalla:latest
