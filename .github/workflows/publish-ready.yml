name: valhalla-publish-ready
# Rescue for the build pipeline's final step: verify the newest draft release
# carries every country's shards (one .tar-00 per country), then upload READY
# and publish it. Round 5 finished 61/61 country legs while `final` failed,
# stranding a complete draft. Job logs are admin-only, so a failed run writes
# a public diagnostics file back into the repo — the run explains itself.
# NOTE (build.yml lesson): no multi-line python heredocs inside YAML block
# scalars — jq one-liners only.
on:
  workflow_dispatch:
    inputs:
      min_countries:
        description: 'Min distinct country slugs required on the draft'
        required: false
        default: '61'
      tag:
        description: 'Target draft tag; empty = newest draft'
        required: false
        default: ''
  push:
    paths: ['.github/workflows/publish-ready.yml']
permissions:
  contents: write
concurrency:
  group: valhalla-publish-ready
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target draft
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.tag }}
        run: |
          set -e -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          # TSV: tag | created | countries | READY — newest first (API order)
          jq -r '.[] | select(.draft) | [.tag_name, .created_at,
            ([.assets[] | select(.name | endswith(".tar-00"))] | length),
            ([.assets[].name] | index("READY") != null)] | @tsv' \
            /tmp/releases.json | tee /tmp/drafts.tsv | sed 's/^/draft: /'
          # Target = newest draft that already carries the full country set —
          # an in-flight build's fresh empty draft must never win the pick.
          MIN_D="${{ github.event.inputs.min_countries || '61' }}"
          TAG=$(awk -F'\t' -v m="$MIN_D" '$3 >= m && $4 == "false" {print $1; exit}' /tmp/drafts.tsv)
          if [ -n "$WANT" ]; then TAG="$WANT"; fi
          if [ -z "$TAG" ]; then echo "no complete draft found"; exit 1; fi
          echo "target=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          { echo "# publish-ready diagnostics ($(date -u '+%Y-%m-%d %H:%M:%SZ'))";
            echo '```'; cat /tmp/drafts.tsv; echo '```'; echo "target: \`$TAG\`"; } > /tmp/diag.md
      - name: Verify country parts, upload READY, publish
        env:
          GH_TOKEN: ${{ github.token }}
          MIN: ${{ github.event.inputs.min_countries || '61' }}
          TAG: ${{ steps.diag.outputs.tag }}
        run: |
          set -e -o pipefail
          exec 2> >(tee /tmp/trace.log >&2)
          set -x
          # Count from the already-fetched releases list: gh api releases/tags
          # NEVER returns drafts (the original `final` job's failure), so every
          # draft lookup must come from this list instead.
          SLUGS=$(jq -r --arg t "$TAG" \
            '.[] | select(.draft and .tag_name == $t)
              | [.assets[] | select(.name | endswith(".tar-00"))] | length' \
            /tmp/releases.json)
          echo "country slugs: $SLUGS (min $MIN)"
          [ "$SLUGS" -ge "$MIN" ] || { echo "incomplete supply — refusing to publish"; exit 2; }
          echo "ok" > READY
          if ! OUT=$(gh release upload "$TAG" READY --clobber --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "upload READY failed: $OUT" >> /tmp/diag.md; exit 3; fi
          if ! OUT=$(gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "publish (edit --draft=false) failed: $OUT" >> /tmp/diag.md; exit 4; fi
          echo "published: $TAG"
      - name: Commit diagnostics on failure
        if: failure()
        run: |
          set -e
          mkdir -p calibration
          { echo "# publish-ready diagnostics ($(date -u '+%Y-%m-%d %H:%M:%SZ'))";
            cat /tmp/diag.md 2>/dev/null || echo '(diagnostics unavailable — failure before resolution)';
            echo; echo '## trace'; echo '```'; tail -60 /tmp/trace.log 2>/dev/null || echo '(no trace)'; echo '```'; } > calibration/publish-ready-diagnostics.md
          git config user.name "anipals-tiles-ci"
          git config user.email "actions@anipals.dev"
          git add calibration/publish-ready-diagnostics.md
          git diff --cached --quiet || { git commit -m "chore: publish-ready diagnostics ($(date -u '+%Y-%m-%d'))"; git pull --rebase origin main; git push origin HEAD:main; }
