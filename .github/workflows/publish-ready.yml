name: valhalla-publish-ready
# Rescue for the build pipeline's final step: verify the newest draft release
# carries every country's shards, then upload READY and publish it. The build
# workflow's `final` job failed once with all 61 country legs green
# (2026-09-29), stranding a complete draft — this re-does that last mile with
# a stricter per-country gate (distinct slugs, not raw asset count, so a
# missing single-part country cannot hide behind multi-part neighbours).
on:
  workflow_dispatch:
    inputs:
      min_countries:
        description: 'Min distinct country slugs required on the draft'
        required: false
        default: '61'
      tag:
        description: 'Target draft tag; empty = newest draft'
        required: false
        default: ''
  push:
    paths: ['.github/workflows/publish-ready.yml']
permissions:
  contents: write
concurrency:
  group: valhalla-publish-ready
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify country parts, upload READY, publish
        env:
          GH_TOKEN: ${{ github.token }}
          MIN: ${{ github.event.inputs.min_countries || '61' }}
          WANT: ${{ github.event.inputs.tag }}
        run: |
          set -e -o pipefail
          TAG=""
          for i in 1 2 3 4 5; do
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.draft)][0].tag_name' 2>/dev/null || true)
            [ -n "$WANT" ] && TAG="$WANT"
            [ -n "$TAG" ] && break
            echo "no draft release yet (try $i)"; sleep 20
          done
          [ -n "$TAG" ] || { echo "no draft release found"; exit 1; }
          echo "target draft: $TAG"
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join("\n")')
          SLUGS=$(echo "$NAMES" | grep -E '\.tar-00$' | sed 's/\.tar-00$//' | sort -u | wc -l | tr -d ' ')
          echo "distinct country slugs: $SLUGS (min $MIN)"
          [ "$SLUGS" -ge "$MIN" ] || { echo "incomplete supply — refusing to publish"; exit 2; }
          echo "ok" > READY
          gh release upload "$TAG" READY --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "published: $TAG"
