name: migrate-release-tiles-to-private-r2
# Explicit migration only. Never modifies a runtime pointer or production service.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed commit SHA'
        required: true
      release_tag:
        description: 'Exact existing complete 61-region release'
        required: true
        default: 'tiles-20260929-26'
      bucket:
        description: 'Authorized private R2 destination bucket'
        required: true
      mode:
        description: 'Pilot only, or pilot followed by all 61 regions'
        type: choice
        options: [pilot, full]
        default: pilot
      pilot_region:
        description: 'Exact existing region slug for the mandatory twenty-tile pilot'
        required: true
        default: 'north-america-canada'
permissions:
  contents: read
concurrency:
  group: migrate-release-tiles-to-r2
  cancel-in-progress: false
env:
  R2_BUCKET: ${{ inputs.bucket }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  GH_TOKEN: ${{ github.token }}
jobs:
  pilot:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.source.outputs.regions }}
      receipt_sha: ${{ steps.receipt.outputs.sha256 }}
      receipt_size: ${{ steps.receipt.outputs.size }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration client
        run: python3 -m pip install --disable-pip-version-check -r tools/storage-requirements.txt
      - name: Validate migration code and all local contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - id: source
        name: Pin exact complete release with all asset pages
        run: python3 tools/migration_ci.py --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --work "$RUNNER_TEMP/migration" prepare
      - name: Verify twenty actual tiles in private R2
        env:
          PILOT_REGION: ${{ inputs.pilot_region }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 -u tools/migrate_release_r2.py --release-json "$RUNNER_TEMP/migration/release.json" --ready "$RUNNER_TEMP/migration/READY" --region "$PILOT_REGION" --mode pilot --work "$RUNNER_TEMP/migration/objects"
      - id: receipt
        name: Retain pilot receipt only in private R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tools/migration_ci.py --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --work "$RUNNER_TEMP/migration" publish-receipt --name pilot --file "$RUNNER_TEMP/migration/objects/pilot-receipt.json"
  migrate:
    if: inputs.mode == 'full'
    needs: pilot
    timeout-minutes: 180
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJSON(needs.pilot.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
      PILOT_SHA: ${{ needs.pilot.outputs.receipt_sha }}
      PILOT_SIZE: ${{ needs.pilot.outputs.receipt_size }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration client
        run: python3 -m pip install --disable-pip-version-check -r tools/storage-requirements.txt
      - name: Revalidate exact source and read back the private pilot
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 tools/migration_ci.py --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --work "$RUNNER_TEMP/migration" prepare
          python3 tools/migration_ci.py --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --work "$RUNNER_TEMP/migration" fetch-pilot --sha256 "$PILOT_SHA" --size "$PILOT_SIZE"
      - name: Stream one isolated region through structural and R2 GET gates
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 -u tools/migrate_release_r2.py --release-json "$RUNNER_TEMP/migration/release.json" --ready "$RUNNER_TEMP/migration/READY" --region "$REGION" --mode full --work "$RUNNER_TEMP/migration/objects" --pilot-receipt "$RUNNER_TEMP/migration/pilot-receipt.json"
      - name: Retain full region receipt only in private R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tools/migration_ci.py --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --work "$RUNNER_TEMP/migration" publish-receipt --name "receipt-$REGION" --file "$RUNNER_TEMP/migration/objects/receipt-$REGION.json"
